name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test, and audit
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://localhost:5432/ci?schema=public
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci
      HASH_SECRET_SALT: ci-only-not-a-secret
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check JavaScript syntax
        shell: bash
        run: find src frontend-client scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build static frontend
        env:
          API_BASE_URL: https://api.example.invalid
        run: npm run build:frontend

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy API and frontend to Render
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::API deploy skipped; configure RENDER_API_DEPLOY_HOOK after creating the Render service."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"

      - name: Trigger frontend deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::Frontend deploy skipped; configure RENDER_FRONTEND_DEPLOY_HOOK after creating the Render service."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
